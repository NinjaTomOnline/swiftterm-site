<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SwiftTerm social preview</title>
  <desc id="desc">SwiftTerm mobile incident console preview with product screenshots.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#121a21"/>
      <stop offset="0.55" stop-color="#071116"/>
      <stop offset="1" stop-color="#05080a"/>
    </linearGradient>
    <clipPath id="ipadClip">
      <rect x="690" y="58" width="360" height="480" rx="32"/>
    </clipPath>
    <clipPath id="phoneClip">
      <rect x="940" y="178" width="168" height="365" rx="30"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M0 96h1200M0 192h1200M0 288h1200M0 384h1200M0 480h1200M96 0v630M192 0v630M288 0v630M384 0v630M480 0v630M576 0v630M672 0v630M768 0v630M864 0v630M960 0v630M1056 0v630" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <rect x="76" y="80" width="96" height="96" rx="24" fill="#007aff"/>
  <path d="M104 118l27 22-27 22" fill="none" stroke="#f6f3ec" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M139 166h26" fill="none" stroke="#12b886" stroke-width="12" stroke-linecap="round"/>
  <text x="76" y="255" fill="#f6f3ec" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="96" font-weight="900" letter-spacing="0">SwiftTerm</text>
  <text x="80" y="322" fill="#d9fff5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="34" font-weight="800" letter-spacing="0">Mobile incident console for iPhone and iPad</text>
  <text x="80" y="390" fill="#aeb8bd" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="26" font-weight="650" letter-spacing="0">SSH sessions. SFTP transfers. Local network checks. Keychain-backed keys.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="22" font-weight="850" letter-spacing="0">
    <rect x="80" y="452" width="178" height="48" rx="8" fill="#007aff"/>
    <text x="106" y="484" fill="#ffffff">Native SSH</text>
    <rect x="276" y="452" width="202" height="48" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="302" y="484" fill="#d9fff5">Local-first</text>
    <rect x="496" y="452" width="186" height="48" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="522" y="484" fill="#d9fff5">SFTP files</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="690" y="58" width="360" height="480" rx="32" fill="#f6f3ec"/>
    <image href="../screenshots/swiftterm-ipad-workspace.png" x="690" y="58" width="360" height="480" preserveAspectRatio="xMidYMin slice" clip-path="url(#ipadClip)"/>
    <rect x="690" y="58" width="360" height="480" rx="32" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="940" y="178" width="168" height="365" rx="30" fill="#f6f3ec"/>
    <image href="../screenshots/swiftterm-iphone-terminal.png" x="940" y="178" width="168" height="365" preserveAspectRatio="xMidYMin slice" clip-path="url(#phoneClip)"/>
    <rect x="940" y="178" width="168" height="365" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="2"/>
  </g>
</svg>
